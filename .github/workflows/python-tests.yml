name: Python Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      PERSONALOS_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
      - name: Check for tracked local configuration
        run: |
          files="$(git ls-files -- ':(glob)**/.env' ':(glob)**/.env.*' ':(glob)**/*.env' ':(glob)**/*.env.*' ':(glob)**/credentials.json' ':(glob)**/token.json' 'secrets/' 'logs/' 'chroma_data/')"
          if [ -n "$files" ]; then
            printf 'Local configuration or runtime files are tracked:\n%s\n' "$files"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -m unit
