services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DASHBOARD_HOST: 0.0.0.0
    volumes:
      - ./secrets:/app/secrets
      - ./chroma_data:/app/chroma_data
      - ./logs:/app/logs
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
